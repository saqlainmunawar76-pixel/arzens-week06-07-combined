; =============================================================================
; Inventory — THE ARZENS Week 07 Task 6
; Groups map to the resources provisioned in Task 5's Terraform config.
; =============================================================================

[webservers]
web01 ansible_host=10.0.1.10
web02 ansible_host=10.0.1.11

[dbservers]
db01 ansible_host=10.0.2.10

; "all_servers" gets every role (common + security + compliance).
; webservers/dbservers can layer additional group_vars if needed later.
[all_servers:children]
webservers
dbservers

[all_servers:vars]
ansible_connection=ssh
ansible_ssh_private_key_file=~/.ssh/arzens_ti_platform.pem
ansible_python_interpreter=/usr/bin/python3
